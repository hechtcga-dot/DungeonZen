# Builds the Windows installer on Windows (tests first) and publishes it on the
# GitHub Releases page: for a pushed version tag (v1.0.0 …), or when run by hand
# with release_tag set (the release and its tag are then created on this commit).
name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to create, e.g. v1.0.0 (leave empty to only build)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx electron-builder install-app-deps
      - run: npm run smoke
      - run: npx electron-builder --win --x64 --publish never
      # The installer and latest.yml (auto-update) must both be here.
      - run: dir dist
      # The real installer: installs silently (per user, no admin), then the smoke test runs on the installed app.
      # Catches what only the packed app gets wrong (native SQLite module, asar paths, missing files).
      - run: |
          $exe = (Get-ChildItem dist\*.exe).FullName
          Start-Process $exe -ArgumentList '/S' -Wait
          $app = "$env:LOCALAPPDATA\Programs\DungeonZen\DungeonZen.exe"
          if (!(Test-Path $app)) { throw "Installer did not install $app" }
          "DZ_APP=$app" >> $env:GITHUB_ENV
        shell: pwsh
      - run: npm run smoke
      # The latest playtest's campaign (examples/example_<name>/, skill `playtest`) as a download beside the .exe.
      - run: Get-ChildItem examples -Directory -Filter 'example_*' | ForEach-Object { Compress-Archive -Path "$($_.FullName)\*" -DestinationPath "dist\$($_.Name).zip" -Force }
        shell: pwsh
      # GitHub zips every artifact itself: upload only the .exe, or the download holds the installer twice (once inside a .zip).
      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-Zen-installer
          path: dist/*.exe
          compression-level: 0
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Dungeon Zen ${{ inputs.release_tag || github.ref_name }}
          # The .exe (owner, 2026-10-12: no second copy as a .zip), latest.yml, which auto-update reads (3.0), and the
          # playtest's example campaign (owner, 2026-10-21).
          files: |
            dist/*.exe
            dist/latest.yml
            dist/example_*.zip
          body: |
            **Install:** download the `Dungeon-Zen-Setup-…exe` file below and run it
            (if your browser warns about it, choose Keep).
            It installs for your Windows account only, so no administrator rights are needed
            (default folder: `%LOCALAPPDATA%\Programs\DungeonZen`, with Start menu and desktop shortcuts).
            Windows SmartScreen may warn that the publisher is unknown (the installer is not code-signed):
            choose "More info", then "Run anyway".
            Uninstall from Settings › Apps; your campaigns and settings are kept.

            **Example campaign:** `example_….zip` is the campaign our test DM made while trying this version.
            Unzip it anywhere, then in Dungeon Zen choose Open a campaign folder… and pick the unzipped folder.

            **Updates:** from 3.0 on, Dungeon Zen downloads new versions by itself and installs them when you close it
            (or at once with Restart now). Coming from 2.x, install this one by hand once.
