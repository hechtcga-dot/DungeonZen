# Typecheck and tests on every push and pull request (the release workflow runs them again on Windows).
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Opens a campaign in the built app and visits every screen (tests/e2e/smoke.mjs); screenshots kept as an artifact.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder install-app-deps
      - run: xvfb-run --auto-servernum npm run smoke
      - run: xvfb-run --auto-servernum npm run smoke
        env:
          DZ_SKIN: adventure
      # Windows display scaling 150% (most laptops).
      - run: xvfb-run --auto-servernum -s "-screen 0 2560x1600x24" npm run smoke
        env:
          DZ_SCALE: '1.5'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: |
            tests/e2e/shots/
            tests/e2e/shots-adventure/
            tests/e2e/shots-scale-1.5/
